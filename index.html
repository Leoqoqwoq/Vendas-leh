<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de Vendas</title>
<style>
:root{--bg:#fdf5f7;--card:#fff;--tx:#2b1d22;--mut:#7d6a71;--pri:#b83b6b;--pri2:#8e2b52;--bd:#f0dbe2;--ok:#2e8b57;--warn:#c27a10;--bad:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1317;--card:#2a1d23;--tx:#f6e9ee;--mut:#b49aa4;--pri:#e0689a;--pri2:#c24f82;--bd:#43303a;--ok:#5cc58a;--warn:#e6a94a;--bad:#ef7b6e}}
:root[data-theme="dark"]{--bg:#1c1317;--card:#2a1d23;--tx:#f6e9ee;--mut:#b49aa4;--pri:#e0689a;--pri2:#c24f82;--bd:#43303a;--ok:#5cc58a;--warn:#e6a94a;--bad:#ef7b6e}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
.w{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:4px 0 14px;color:var(--pri)}
h2{font-size:1.05rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.st small{color:var(--mut);display:block;font-size:.75rem}
.st b{font-size:1.2rem}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g .f{grid-column:1/-1}
label{font-size:.78rem;color:var(--mut);display:block;margin-bottom:3px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 14px}
.pri{background:var(--pri);color:#fff;width:100%;font-weight:600;margin-top:12px}
.pri:active{background:var(--pri2)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;background:var(--card);color:var(--mut);border:1px solid var(--bd)}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.bar{display:flex;gap:8px;margin-bottom:10px}
.it{border-top:1px solid var(--bd);padding:10px 0}
.it:first-child{border-top:0}
.r{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.mut{color:var(--mut);font-size:.82rem}
.tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.ok{color:var(--ok)}.pend{color:var(--warn)}
.act{display:flex;gap:6px;margin-top:6px}
.act button{padding:6px 10px;font-size:.8rem;background:transparent;border:1px solid var(--bd);color:var(--tx)}
.act .del{color:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:18px 0}
</style>
</head>
<body>
<div class="w">
<h1>🌸 Controle de Vendas</h1>

<div class="stats">
<div class="st"><small>Total vendido</small><b id="sT">R$ 0,00</b></div>
<div class="st"><small>Recebido</small><b id="sR" class="ok">R$ 0,00</b></div>
<div class="st"><small>A receber</small><b id="sP" class="pend">R$ 0,00</b></div>
<div class="st"><small>Vendas · peças</small><b id="sN">0 · 0</b></div>
</div>

<div class="card">
<h2>Nova venda</h2>
<div class="g">
<div class="f"><label>Nome da cliente</label><input id="cli" list="cls" placeholder="Ex.: Maria Souza" autocomplete="off"><datalist id="cls"></datalist></div>
<div><label>Código do produto</label><input id="cod" placeholder="Ex.: LG-102"></div>
<div><label>Valor (R$)</label><input id="val" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0,00"></div>
<div class="f"><label>Descrição (opcional)</label><input id="des" placeholder="Ex.: Conjunto renda preto M"></div>
<div><label>Quantidade</label><input id="qtd" type="number" inputmode="numeric" min="1" value="1"></div>
<div><label>Data</label><input id="dt" type="date"></div>
<div><label>Pagamento</label><select id="pg"><option>Pix</option><option>Dinheiro</option><option>Cartão</option><option>Fiado</option></select></div>
<div><label>Situação</label><select id="ok"><option value="1">Pago</option><option value="0">Pendente</option></select></div>
</div>
<button class="pri" id="add">Adicionar venda</button>
</div>

<div class="tabs"><button class="on" data-t="v">Vendas</button><button data-t="c">Clientes</button><button data-t="m">Meses</button></div>

<div id="pv" class="card">
<div class="bar"><input id="q" placeholder="Buscar cliente, código ou produto"><select id="fs" style="width:130px"><option value="">Todas</option><option value="1">Pagas</option><option value="0">Pendentes</option></select></div>
<div id="lst"></div>
</div>
<div id="pc" class="card" hidden><h2>Clientes (quem mais compra)</h2><div id="lc"></div></div>
<div id="pm" class="card" hidden><h2>Vendas por mês</h2><div id="lm"></div></div>
</div>

<script>
const $=id=>document.getElementById(id);
const K="vendas-lingerie-v1";
let S=[];
try{S=JSON.parse(localStorage.getItem(K)||"[]")}catch(e){S=[]}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const brl=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hoje=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fd=d=>d.split("-").reverse().join("/");
const tot=v=>v.valor*v.qtd;
$("dt").value=hoje();

$("add").onclick=()=>{
  const cliente=$("cli").value.trim(),codigo=$("cod").value.trim(),valor=parseFloat($("val").value);
  if(!cliente||!codigo||!(valor>=0)||isNaN(valor)){alert("Preencha cliente, código e valor.");return}
  S.unshift({id:Date.now(),cliente,codigo,valor,produto:$("des").value.trim(),qtd:Math.max(1,parseInt($("qtd").value)||1),data:$("dt").value||hoje(),pgto:$("pg").value,pago:$("ok").value==="1"});
  save();
  ["cli","cod","val","des"].forEach(i=>$(i).value="");$("qtd").value=1;$("dt").value=hoje();
  render();
};

function render(){
  const T=S.reduce((a,v)=>a+tot(v),0),R=S.filter(v=>v.pago).reduce((a,v)=>a+tot(v),0);
  $("sT").textContent=brl(T);$("sR").textContent=brl(R);$("sP").textContent=brl(T-R);
  $("sN").textContent=S.length+" · "+S.reduce((a,v)=>a+v.qtd,0);
  $("cls").innerHTML=[...new Set(S.map(v=>v.cliente))].map(c=>`<option value="${esc(c)}">`).join("");

  const q=$("q").value.toLowerCase(),f=$("fs").value;
  const L=S.filter(v=>(f===""||(v.pago?"1":"0")===f)&&(v.cliente+v.codigo+v.produto).toLowerCase().includes(q));
  $("lst").innerHTML=L.length?L.map(v=>`<div class="it"><div class="r"><div><b>${esc(v.cliente)}</b><div class="mut">${esc(v.codigo)}${v.produto?" · "+esc(v.produto):""}</div><div class="mut">${fd(v.data)} · ${esc(v.pgto)} · ${v.qtd}x ${brl(v.valor)}</div></div><div style="text-align:right"><b>${brl(tot(v))}</b><div><span class="tag ${v.pago?"ok":"pend"}">${v.pago?"Pago":"Pendente"}</span></div></div></div>
  <div class="act"><button onclick="tg(${v.id})">${v.pago?"Marcar pendente":"Marcar como pago"}</button><button class="del" onclick="rm(${v.id})">Excluir</button></div></div>`).join(""):`<div class="empty">Nenhuma venda encontrada.</div>`;

  const C={};S.forEach(v=>{const c=C[v.cliente]||(C[v.cliente]={t:0,p:0,n:0});c.t+=tot(v);c.n++;if(!v.pago)c.p+=tot(v)});
  const CE=Object.entries(C).sort((a,b)=>b[1].t-a[1].t);
  $("lc").innerHTML=CE.length?CE.map(([n,c])=>`<div class="it r"><div><b>${esc(n)}</b><div class="mut">${c.n} compra(s)</div></div><div style="text-align:right"><b>${brl(c.t)}</b>${c.p?`<div class="mut pend">Deve ${brl(c.p)}</div>`:""}</div></div>`).join(""):`<div class="empty">Sem clientes ainda.</div>`;

  const M={};S.forEach(v=>{const k=v.data.slice(0,7);M[k]=(M[k]||0)+tot(v)});
  const ME=Object.entries(M).sort((a,b)=>b[0].localeCompare(a[0]));
  $("lm").innerHTML=ME.length?ME.map(([k,t])=>`<div class="it r"><b>${k.slice(5)}/${k.slice(0,4)}</b><b>${brl(t)}</b></div>`).join(""):`<div class="empty">Sem vendas ainda.</div>`;
}
window.tg=id=>{const v=S.find(x=>x.id===id);if(v){v.pago=!v.pago;save();render()}};
window.rm=id=>{if(confirm("Excluir esta venda?")){S=S.filter(x=>x.id!==id);save();render()}};
$("q").oninput=render;$("fs").onchange=render;
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  $("pv").hidden=b.dataset.t!=="v";$("pc").hidden=b.dataset.t!=="c";$("pm").hidden=b.dataset.t!=="m";
});
render();
</script>
</body>
</html>
