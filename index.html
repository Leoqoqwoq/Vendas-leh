<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">

<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.bc span{font-size:10px;color:var(--m);height:14px}
.em{text-align:center;color:var(--m);padding:18px 0}
.tl{display:grid;gap:8px;margin-top:10px}.tl button{border:1px solid var(--b);text-align:left;background:transparent}

input:focus,select:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 3px rgba(255,95,162,.2)}

.bar{display:flex;gap:8px;margin-bottom:14px}.bar select{width:120px}
.pri{background:var(--grad);color:#fff;width:100%;font-weight:600;padding:14px;margin-top:14px;border-radius:16px;box-shadow:0 6px 20px rgba(255,95,162,.4)}
nav{position:fixed;left:12px;right:12px;max-width:616px;margin:0 auto;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:2px;padding:6px;background:var(--c);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);border:1px solid var(--b);border-radius:28px;box-shadow:var(--sh),0 12px 32px rgba(155,107,255,.2)}
nav button{flex:1;background:none;border-radius:22px;font-size:.65rem;color:var(--m);padding:7px 0}
nav button span{display:block;font-size:1.2rem;filter:grayscale(.5)}
nav button.on{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(255,95,162,.45)}nav button.on span{filter:none}
.fab{position:fixed;right:20px;bottom:calc(92px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--grad);color:#fff;font-size:30px;padding:0;box-shadow:0 6px 22px rgba(255,95,162,.55),0 0 0 7px rgba(255,95,162,.12)}
.md{position:fixed;inset:0;background:rgba(35,10,45,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;z-index:20}.md[hidden]{display:none}
.sh{background:var(--bg);width:100%;max-width:640px;margin:0 auto;max-height:94%;overflow:auto;border-radius:28px 28px 0 0;border-top:1px solid var(--b);padding:20px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(155,107,255,.2)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g .f{grid-column:1/-1}

.pr .in{flex:1;min-width:0}.qt{display:flex;gap:8px}.qt button{width:34px;height:34px;padding:0;border:1px solid var(--b);background:transparent;font-size:1.1rem;border-radius:50%}
.pv{width:130px;height:130px;border-radius:20px;object-fit:cover;background:var(--b);display:none;margin:0 auto 12px}
</style></head><body>
<div class="w">
<h1>✦ Minhas Vendas</h1><div class="sub">Vendas &amp; Estoque</div>
<div class="card" id="login"><h2>Entrar</h2><label>E-mail</label><input id="em" type="email" autocomplete="username"><label style="margin-top:8px">Senha</label><input id="sn" type="password" autocomplete="current-password"><p id="lerr" class="dn"></p><button class="pri" id="lg">Entrar</button></div>

</div></div>
<div class="md" id="md" hidden><div class="sh"><h2 id="mt">Nova venda</h2><div class="g">

<div><label>Data</label><input id="f-dt" type="date"></div>

</div><button class="pri" id="sv">Salvar</button><button class="pri" style="background:transparent;color:var(--m);margin-top:6px" id="cx">Cancelar</button></div></div>
<div class="md" id="pm" hidden><div class="sh"><h2 id="pt">Novo produto</h2><img id="pv" class="pv" alt=""><button class="pri" style="background:transparent;color:var(--p);border:1px solid var(--p);margin-top:0" id="ph">📷 Tirar ou escolher foto</button><input type="file" id="pfi" accept="image/*" hidden><div class="g" style="margin-top:10px"><div><label>Código</label><input id="p-cod"></div><div><label>Preço (R$)</label><input id="p-pre" type="number" inputmode="decimal" step="0.01" min="0"></div><div class="f"><label>Nome do produto</label><input id="p-nom"></div><div class="f"><label>Quantidade em estoque</label><input id="p-qtd" type="number" inputmode="numeric" min="0"></div></div><button class="pri" id="ps">Salvar produto</button><button class="pri" style="background:transparent;color:var(--m);margin-top:6px" id="pc">Cancelar</button></div></div>
<datalist id="cls"></datalist><datalist id="cds"></datalist><input type="file" id="pci" accept=".csv,text/csv,text/plain" hidden><input type="file" id="fl" accept=".json,application/json" hidden>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,collection,doc,setDoc,updateDoc,deleteDoc,onSnapshot,increment} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const $=id=>document.getElementById(id);
const app=initializeApp({apiKey:"AIzaSyD0caFJXhtPW15wnKu1aKUk8AD0mIW1Lck",authDomain:"vendas-leh.firebaseapp.com",projectId:"vendas-leh",storageBucket:"vendas-leh.firebasestorage.app",messagingSenderId:"1054349259797",appId:"1:1054349259797:web:9f8069331de4cef176ca1c"});
const auth=getAuth(app),fdb=initializeFirestore(app,{localCache:persistentLocalCache()});
let S=[],PR=[],ed2=null,pf="",pq="",M=0,uid=null,unsubs=[],mig=false,tab="i",P="mes",ed=null,q="",fs="",TL={},PN={};
const ref=id=>doc(fdb,"users",uid,"vendas",String(id));
const put=v=>setDoc(ref(v.id),v).catch(e=>alert("Erro ao salvar: "+e.message));
const brl=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const hoje=()=>iso(new Date()),fd=d=>d.split("-").reverse().join("/"),tot=v=>v.valor*v.qtd,sum=L=>L.reduce((a,v)=>a+tot(v),0);
const D=(y,m,d)=>new Date(y,m,d);
const COM=40,com=v=>v*COM/100;
function rng(p){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),d=n.getDate();
if(p==="hoje")return[[iso(n),iso(n)],[iso(D(y,m,d-1)),iso(D(y,m,d-1))]];
if(p==="7d")return[[iso(D(y,m,d-6)),iso(n)],[iso(D(y,m,d-13)),iso(D(y,m,d-7))]];
if(p==="mes")return[[iso(D(y,m,1)),iso(n)],[iso(D(y,m-1,1)),iso(D(y,m,0))]];
if(p==="ano")return[[y+"-01-01",iso(n)],[(y-1)+"-01-01",(y-1)+"-12-31"]];
return[["0000","9999"],null]}
const inR=(v,r)=>v.data>=r[0]&&v.data<=r[1];
const grp=(L,f)=>{const o={};L.forEach(v=>{const k=f(v),g=o[k]||(o[k]={n:0,t:0,q:0,p:0,k});g.n++;g.t+=tot(v);g.q+=v.qtd;if(!v.pago)g.p+=tot(v)});return Object.values(o).sort((a,b)=>b.t-a.t)};
const wa=(nome,tel,val)=>{let t=(tel||"").replace(/\D/g,"");if(t.length<=11)t="55"+t;return"https://wa.me/"+t+"?text="+encodeURIComponent("Oi "+nome.split(" ")[0]+"! Tudo bem? Passando para lembrar do pagamento de "+brl(val)+" das suas peças. Qualquer dúvida estou à disposição 💕")};
const dl=(n,s,t)=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:t}));a.download=n;document.body.appendChild(a);a.click();a.remove()};
const chips=()=>`<div class="chips">${[["hoje","Hoje"],["7d","7 dias"],["mes","Mês"],["ano","Ano"],["tudo","Tudo"]].map(([k,l])=>`<button data-p="${k}" class="${P===k?"on":""}">${l}</button>`).join("")}</div>`;
const it=v=>`<div class="it"><div class="r"><div><b>${esc(v.cliente)}</b><small>${esc(v.codigo)}${v.produto?" · "+esc(v.produto):""}<br>${fd(v.data)} · ${esc(v.pgto)} · ${v.qtd}x ${brl(v.valor)}</small></div><div class="rt"><b>${brl(tot(v))}</b><span class="tg ${v.pago?"ok":"pn"}">${v.pago?"Pago":"Pendente"}</span></div></div><div class="ac"><button data-a="pg" data-i="${v.id}">${v.pago?"Marcar pendente":"Marcar pago ✓"}</button><button data-a="ed" data-i="${v.id}">Editar</button>${!v.pago&&TL[v.cliente]?`<button data-a="wa" data-i="${v.id}">Cobrar</button>`:""}<button class="dl" data-a="rm" data-i="${v.id}">Excluir</button></div></div>`;
function bars(L){let ks=[],f;if(P==="ano"||P==="tudo"){f=v=>v.data.slice(0,7);ks=P==="ano"?[...Array(12)].map((_,i)=>new Date().getFullYear()+"-"+String(i+1).padStart(2,"0")):[...new Set(S.map(f))].sort()}else{f=v=>v.data;const[a,b]=rng(P)[0];for(let d=new Date(a+"T12:00");iso(d)<=b;d.setDate(d.getDate()+1))ks.push(iso(d))}
const o={};L.forEach(v=>o[f(v)]=(o[f(v)]||0)+tot(v));const mx=Math.max(1,...ks.map(k=>o[k]||0)),st=Math.ceil(ks.length/7)||1;
return`<div class="bars">${ks.map((k,i)=>`<div class="bc"><i style="height:${(o[k]||0)/mx*88}%" title="${brl(o[k]||0)}"></i><span>${i%st?"":(k.length>7?k.slice(8):k.slice(5))}</span></div>`).join("")}</div>`}
function vI(){const[r,pr]=rng(P),L=S.filter(v=>inR(v,r)),T=sum(L),R=sum(L.filter(v=>v.pago));
let dd="";if(pr){const t0=sum(S.filter(v=>inR(v,pr)));if(t0)dd=`<span class="d ${T>=t0?"up":"dn"}">${T>=t0?"▲":"▼"} ${Math.abs(Math.round((T-t0)/t0*100))}% vs período anterior</span>`}
const mt=sum(S.filter(v=>v.data.startsWith(hoje().slice(0,7)))),pc=M?Math.min(100,Math.round(mt/M*100)):0;
return chips()+`<div class="card"><small>Faturamento</small><div class="big">${brl(T)}</div>${dd}<small style="margin-top:6px">Sua comissão (${COM}%): <b class="ok">${brl(com(T))}</b></small></div>
<div class="kp"><div class="card"><small>Recebido</small><b class="ok">${brl(R)}</b></div><div class="card"><small>A receber</small><b class="pn">${brl(T-R)}</b></div><div class="card"><small>Vendas</small><b>${L.length}</b></div><div class="card"><small>Ticket médio</small><b>${brl(L.length?T/L.length:0)}</b></div></div>
<div class="card"><div class="r"><b>Meta do mês</b><button class="ln" data-a="meta">${M?"Editar":"Definir"}</button></div>${M?`<div class="pg"><i style="width:${pc}%"></i></div><small>${brl(mt)} de ${brl(M)} · ${pc}%</small>`:"<small>Defina uma meta para acompanhar o progresso.</small>"}</div>
<div class="card"><b>Vendas no período</b>${bars(L)}</div>
${PR.some(p=>p.qtd<=2)?`<div class="card"><b>⚠️ Estoque baixo</b>${PR.filter(p=>p.qtd<=2).map(p=>`<div class="it r"><span>${esc(p.nome)}</span><span class="${p.qtd<=0?"dn":"pn"}">${p.qtd<=0?"Esgotado":p.qtd+" un."}</span></div>`).join("")}</div>`:""}<div class="card"><b>Últimas vendas</b>${S.slice(0,5).map(it).join("")||'<div class="em">Nenhuma venda ainda. Toque no + para começar.</div>'}</div>`}
function vV(){return`<div class="bar"><input id="q" placeholder="Buscar cliente ou código" value="${esc(q)}"><select id="fs"><option value=""${fs===""?" selected":""}>Todas</option><option value="1"${fs==="1"?" selected":""}>Pagas</option><option value="0"${fs==="0"?" selected":""}>Pendentes</option></select></div><div class="card" id="lst"></div>`}
function lst(){const s=q.toLowerCase(),L=S.filter(v=>(fs===""||(v.pago?"1":"0")===fs)&&(v.cliente+v.codigo+(v.produto||"")).toLowerCase().includes(s));$("lst").innerHTML=L.length?L.map(it).join(""):'<div class="em">Nenhuma venda encontrada</div>'}
function vC(){const G=grp(S,v=>v.cliente);return`<div class="card"><b>Clientes (${G.length})</b>${G.map(g=>`<div class="it r"><div><b>${esc(g.k)}</b><small>${g.n} compra(s)${TL[g.k]?" · "+esc(TL[g.k]):""}</small></div><div class="rt"><b>${brl(g.t)}</b>${g.p?`<span class="pn">Deve ${brl(g.p)}</span>`:""}${g.p&&TL[g.k]?`<button class="ln" data-a="wc" data-n="${esc(g.k)}" data-v="${g.p}">Cobrar no WhatsApp</button>`:""}</div></div>`).join("")||'<div class="em">Sem clientes</div>'}</div>`}
function vR(){const[r]=rng(P),L=S.filter(v=>inR(v,r)),rows=(A,l)=>A.slice(0,8).map(g=>`<div class="it r"><div>${esc(l(g))}<small>${g.n} venda(s) · ${g.q} peça(s)</small></div><b>${brl(g.t)}</b></div>`).join("")||'<div class="em">Sem dados</div>';
return chips()+`<div class="card"><b>🏆 Produtos mais vendidos</b>${rows(grp(L,v=>v.codigo),g=>g.k+(PN[g.k]?" · "+PN[g.k]:""))}</div>
<div class="card"><b>👑 Melhores clientes</b>${rows(grp(L,v=>v.cliente),g=>g.k)}</div>
<div class="card"><b>💳 Por forma de pagamento</b>${rows(grp(L,v=>v.pgto),g=>g.k)}</div>
<div class="card"><b>⏳ Clientes devendo (geral)</b>${rows(grp(S.filter(v=>!v.pago),v=>v.cliente),g=>g.k)}</div>
<div class="card"><b>Ferramentas</b><div class="tl"><button data-a="csv">Exportar planilha (CSV)</button><button data-a="bk">Salvar backup</button><button data-a="rs">Restaurar backup</button><button data-a="so">Sair da conta</button></div></div>`}
const prod=c=>PR.find(p=>p.codigo.toLowerCase()===String(c).trim().toLowerCase());
const pref=id=>doc(fdb,"users",uid,"produtos",String(id));
const adj=(c,n)=>{const p=prod(c);if(p&&n)updateDoc(pref(p.id),{qtd:increment(n)})};
const comp=f=>new Promise(r=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,480/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL("image/jpeg",.7))};i.onerror=()=>r("");i.src=u});
const pfil=()=>{const k=pq.toLowerCase();return PR.filter(p=>(p.nome+p.codigo).toLowerCase().includes(k)).sort((a,b)=>a.nome.localeCompare(b.nome))};
const plist=()=>pfil().map(p=>`<div class="pr">${p.foto?`<img class="th" src="${p.foto}" alt="">`:'<div class="th">👙</div>'}<div class="in"><b>${esc(p.nome)}</b><small>${esc(p.codigo)} · ${brl(p.preco)}</small><span class="tg ${p.qtd<=0?"dn":p.qtd<=2?"pn":"ok"}">${p.qtd<=0?"Esgotado":p.qtd+" un."}</span></div><div class="rt"><div class="qt"><button data-a="pm" data-i="${p.id}">−</button><button data-a="pp" data-i="${p.id}">+</button></div><button class="ln" data-a="pe" data-i="${p.id}">Editar</button><button class="ln dl" data-a="px" data-i="${p.id}">Excluir</button></div></div>`).join("")||'<div class="em">Nenhum produto. Toque em + Produto.</div>';
function vE(){const un=PR.reduce((a,p)=>a+p.qtd,0),vl=PR.reduce((a,p)=>a+p.qtd*p.preco,0);
return`<div class="kp"><div class="card"><small>Peças em estoque</small><b>${un}</b></div><div class="card"><small>Valor em estoque</small><b>${brl(vl)}</b></div></div><div class="card"><small>Se vender tudo, sua comissão (${COM}%)</small><div class="big" style="font-size:1.7rem">${brl(com(vl))}</div></div><div class="bar"><input id="pq" placeholder="Buscar produto" value="${esc(pq)}"><button class="pri" style="width:auto;margin:0;padding:0 14px" data-a="pn">+ Produto</button></div><div style="margin:-6px 0 12px"><button class="ln" data-a="imp">📥 Importar planilha (CSV)</button></div><div class="card" id="pl">${plist()}</div>`}
const shp=()=>{$("pv").src=pf;$("pv").style.display=pf?"block":"none"};
function openP(p){ed2=p?p.id:null;pf=p?p.foto||"":"";$("pt").textContent=p?"Editar produto":"Novo produto";$("p-cod").value=p?p.codigo:"";$("p-nom").value=p?p.nome:"";$("p-pre").value=p?p.preco:"";$("p-qtd").value=p?p.qtd:1;shp();$("pm").hidden=false}
function render(){TL={};PN={};[...S].reverse().forEach(v=>{if(v.tel)TL[v.cliente]=v.tel;if(v.produto)PN[v.codigo]=v.produto});
$("v").innerHTML=({i:vI,v:vV,e:vE,c:vC,r:vR})[tab]();if(tab==="v")lst();
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
const op=a=>[...new Set(a)].map(c=>`<option value="${esc(c)}">`).join("");$("cls").innerHTML=op(S.map(v=>v.cliente));$("cds").innerHTML=op(PR.map(p=>p.codigo).concat(S.map(v=>v.codigo)))}
function openF(v){ed=v?v.id:null;$("mt").textContent=v?"Editar venda":"Nova venda";const o=v||{cliente:"",tel:"",codigo:"",produto:"",valor:"",qtd:1,data:hoje(),pgto:"Pix",pago:true};
$("f-cli").value=o.cliente;$("f-tel").value=o.tel||"";$("f-cod").value=o.codigo;$("f-des").value=o.produto||"";$("f-val").value=o.valor;$("f-qtd").value=o.qtd;$("f-dt").value=o.data;$("f-pg").value=o.pgto;$("f-ok").value=o.pago?"1":"0";$("md").hidden=false}
function csv(){const[r]=rng(P),L=S.filter(v=>inR(v,r)).sort((a,b)=>a.data.localeCompare(b.data)),c=x=>'"'+String(x??"").replace(/"/g,'""')+'"',n=x=>String(Math.round(x*100)/100).replace(".",",");
dl("vendas-"+P+".csv","\ufeffData;Cliente;Telefone;Código;Produto;Qtd;Valor;Total;Pagamento;Situação\n"+L.map(v=>[fd(v.data),v.cliente,v.tel||"",v.codigo,v.produto||"",v.qtd,n(v.valor),n(tot(v)),v.pgto,v.pago?"Pago":"Pendente"].map(c).join(";")).join("\n"),"text/csv")}
document.addEventListener("click",e=>{const t=e.target.closest("[data-a],[data-p],[data-t]");if(!t)return;const d=t.dataset;
if(d.t){tab=d.t;render();scrollTo(0,0);return}
if(d.p){P=d.p;render();return}
const pp=PR.find(x=>x.id==d.i);
if(d.a==="pn")openP();
if(d.a==="imp")$("pci").click();
if(d.a==="pe"&&pp)openP(pp);
if(d.a==="px"&&pp&&confirm("Excluir este produto?"))deleteDoc(pref(pp.id));
if(d.a==="pm"&&pp&&pp.qtd>0)updateDoc(pref(pp.id),{qtd:increment(-1)});
if(d.a==="pp"&&pp)updateDoc(pref(pp.id),{qtd:increment(1)});
const v=S.find(x=>x.id==d.i);
if(d.a==="pg"&&v)updateDoc(ref(v.id),{pago:!v.pago});
if(d.a==="ed"&&v)openF(v);
if(d.a==="rm"&&v&&confirm("Excluir esta venda?")){adj(v.codigo,v.qtd);deleteDoc(ref(v.id))}
if(d.a==="wa"&&v)open(wa(v.cliente,TL[v.cliente],tot(v)));
if(d.a==="wc")open(wa(d.n,TL[d.n],+d.v));
if(d.a==="meta"){const x=prompt("Meta de faturamento do mês (R$):",M||"");if(x!==null)setDoc(doc(fdb,"users",uid,"config","meta"),{valor:parseFloat(String(x).replace(",","."))||0})}
if(d.a==="csv")csv();
if(d.a==="bk")dl("vendas-backup-"+hoje()+".json",JSON.stringify(S),"application/json");
if(d.a==="rs")$("fl").click();
if(d.a==="so")signOut(auth);
if(d.a==="new")openF()});
document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value;lst()}if(e.target.id==="pq"){pq=e.target.value;$("pl").innerHTML=plist()}});
document.addEventListener("change",e=>{const t=e.target;
if(t.id==="fs"){fs=t.value;lst()}
if(t.id==="f-cod"&&!$("f-des").value&&!$("f-val").value){const p=prod(t.value),s=S.find(v=>v.codigo.toLowerCase()===t.value.trim().toLowerCase());if(p){$("f-des").value=p.nome;$("f-val").value=p.preco}else if(s){$("f-des").value=s.produto||"";$("f-val").value=s.valor}}
if(t.id==="f-cli"&&!$("f-tel").value&&TL[t.value])$("f-tel").value=TL[t.value];
if(t.id==="fl"){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;if(confirm("Adicionar "+d.length+" vendas do backup?"))d.forEach(put)}catch(x){alert("Arquivo inválido.")}t.value=""};r.readAsText(f)}});
$("sv").onclick=()=>{const g=i=>$(i).value.trim(),c=g("f-cli"),k=g("f-cod"),val=parseFloat(g("f-val").replace(",","."));
if(!c||!k||isNaN(val)||val<0){alert("Preencha cliente, código e valor.");return}
const qt=Math.max(1,parseInt(g("f-qtd"))||1),old=ed&&S.find(x=>x.id===ed),pr=prod(k);if(pr&&!old&&qt>pr.qtd&&!confirm("Só há "+pr.qtd+" em estoque desse produto. Continuar mesmo assim?"))return;if(old)adj(old.codigo,old.qtd);adj(k,-qt);put({id:ed||Date.now(),cliente:c,tel:g("f-tel"),codigo:k,produto:g("f-des"),valor:val,qtd:qt,data:g("f-dt")||hoje(),pgto:$("f-pg").value,pago:$("f-ok").value==="1"});$("md").hidden=true};
$("cx").onclick=()=>$("md").hidden=true;
const num=x=>{x=String(x||"").trim();return parseFloat(x.includes(",")?x.replace(/\./g,"").replace(",","."):x)};
$("pci").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{e.target.value="";impCSV(r.result)};r.readAsText(f)};
function impCSV(txt){const L=txt.replace(/^\ufeff/,"").split(/\r?\n/).filter(x=>x.trim()),sep=L[0].includes(";")?";":",";
const R=L.map(l=>l.split(sep).map(c=>c.replace(/^"|"$/g,"").trim())).filter(c=>c[0]&&!isNaN(num(c[2]))&&!isNaN(num(c[3])));
if(!R.length){alert("Não encontrei produtos no arquivo. Use as colunas: codigo;nome;preco;qtd");return}
const nv=R.filter(c=>!prod(c[0])).length;
if(!confirm("Importar "+R.length+" produtos? "+nv+" novos; nos "+(R.length-nv)+" já cadastrados a quantidade será somada."))return;
R.forEach((c,i)=>{const q=Math.max(0,parseInt(c[3])||0),o=prod(c[0]);
if(o)updateDoc(pref(o.id),{qtd:increment(q)});
else{const id=Date.now()+i;setDoc(pref(id),{id,codigo:c[0],nome:c[1]||c[0],preco:num(c[2]),qtd:q,foto:""}).catch(x=>alert("Erro ao salvar: "+x.message))}});
alert("Importação enviada! Os produtos aparecem em instantes.")}
$("pc").onclick=()=>$("pm").hidden=true;
$("ph").onclick=()=>$("pfi").click();
$("pfi").onchange=async e=>{const f=e.target.files[0];if(f){pf=await comp(f);shp()}e.target.value=""};
$("ps").onclick=()=>{const g=i=>$(i).value.trim(),k=g("p-cod"),n=g("p-nom"),pre=parseFloat(g("p-pre").replace(",","."));
if(!k||!n||isNaN(pre)||pre<0){alert("Preencha código, nome e preço.");return}
const o=prod(k);if(o&&o.id!==ed2){alert("Já existe um produto com esse código.");return}
const id=ed2||Date.now();setDoc(pref(id),{id,codigo:k,nome:n,preco:pre,qtd:Math.max(0,parseInt(g("p-qtd"))||0),foto:pf}).catch(e=>alert("Erro ao salvar: "+e.message));$("pm").hidden=true};
$("lg").onclick=async()=>{$("lerr").textContent="";try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("sn").value)}catch(e){$("lerr").textContent="E-mail ou senha incorretos."}};
function migra(){if(mig)return;mig=true;let L=[];try{L=JSON.parse(localStorage.getItem("vendas-lingerie-v1")||"[]")}catch(e){}
if(L.length&&confirm("Encontrei "+L.length+" vendas salvas neste aparelho. Enviar para a nuvem?")){Promise.all(L.map(put)).then(()=>{try{localStorage.removeItem("vendas-lingerie-v1")}catch(e){}})}}
onAuthStateChanged(auth,u=>{unsubs.forEach(f=>f());unsubs=[];
if(!u){uid=null;S=[];PR=[];M=0;$("app").hidden=true;$("login").hidden=false;return}
uid=u.uid;$("login").hidden=true;$("app").hidden=false;
unsubs=[onSnapshot(collection(fdb,"users",uid,"vendas"),s=>{S=s.docs.map(d=>d.data()).sort((a,b)=>b.id-a.id);render();migra()},e=>alert("Erro ao carregar: "+e.message)),
onSnapshot(doc(fdb,"users",uid,"config","meta"),s=>{M=s.exists()?s.data().valor||0:0;render()}),onSnapshot(collection(fdb,"users",uid,"produtos"),s=>{PR=s.docs.map(d=>d.data());render()})]});
</script></body></html>
