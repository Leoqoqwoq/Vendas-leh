<style>

.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g .f{grid-column:1/-1}
.grid-pr{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.i-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600;font-size:.85rem}
#add-item{width:100%;margin-top:0;background:transparent;color:var(--p);border:1px dashed var(--p)}
.totline{font-weight:700;text-align:right;margin:8px 2px 0}
.ol{margin:6px 0 0;padding:0;list-style:none}
.ol li{font-size:.8rem;color:var(--m);padding:1px 0}
.fp{display:block;text-align:center;margin-top:12px;color:var(--p);background:none;border:0;padding:0;width:100%;font-size:.9rem}

.det[open]>summary .chev{transform:rotate(180deg)}
.det .body{margin-top:10px;animation:fadeDown .28s var(--ease)}
.rank{display:grid;gap:10px;margin-bottom:14px}

#v.swap{animation:tabSwap .32s var(--ease)}

#inst[hidden],#f-vence-wrap[hidden]{display:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body>
<div class="w">

<script type="module">

const app=initializeApp({apiKey:"AIzaSyD0caFJXhtPW15wnKu1aKUk8AD0mIW1Lck",authDomain:"vendas-leh.firebaseapp.com",projectId:"vendas-leh",storageBucket:"vendas-leh.firebasestorage.app",messagingSenderId:"1054349259797",appId:"1:1054349259797:web:9f8069331de4cef176ca1c"});

let S=[],PR=[],ed2=null,pf="",pq="",M=0,uid=null,unsubs=[],mig=false,migP=false,tab="i",P="mes",ed=null,q="",fs="",df="",dt="",TL={},PN={},COM=40,defP=null;

const hoje=()=>iso(new Date()),fd=d=>d?d.split("-").reverse().join("/"):"",tot=v=>v.valor*v.qtd,sum=L=>L.reduce((a,v)=>a+tot(v),0);
